# Send-ToNext.cfg - settings for tools\PS-Send-ToNext.ps1
#
# key = value, '#' starts a comment.

# The PC running ZX-Next-Unite with its NextSync HTTP bridge enabled.
# NOT the Next's address. 127.0.0.1 = Unite runs on this same machine.
bridge_ip   = 127.0.0.1
bridge_port = 80

# Only if Unite's Settings has "Require bearer token" on - paste it here.
token       =

# What gets pushed: the .nex build.ps1 produces, beside this file.
file        = SampleNex.nex

# Where it lands. The autoexec loop moves this aside and .nexloads it.
remote_path = /dev/incoming.nex

# After a verified push, tell the Next to leave the Listener and run it.
forceexit_after_send = yes

# Seconds to wait for a Next to appear. 0 = wait for ever (Ctrl-C stops).
wait_timeout = 60
